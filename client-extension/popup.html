<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DebugSnap Recorder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Header: Logo + Brand + Status Badge -->
    <div class="header">
      <div class="header-brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 3H3v2M21 3h-2v2M3 19v2h2M19 21h2v-2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="5" stroke="white" stroke-width="1.8" />
            <path d="M12 7v10M7 12h10" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
            <polygon points="11,10.5 14,12 11,13.5" fill="white"/>
          </svg>
        </div>
        <div class="header-title">
          <h2>Debug<span>Snap</span></h2>
          <small>Session Recorder</small>
        </div>
      </div>

      <!-- Status badge — dynamically updated by popup.js -->
      <div class="status-badge ready" id="headerStatusBadge">
        <span class="status-dot-sm" id="headerStatusDot"></span>
        <span id="headerStatusText">Loading</span>
      </div>
    </div>

    <!-- Dynamic content injected by popup.js -->
    <div class="content" id="content">
      <div class="state-card">
        <div class="spinner"></div>
        <p class="message">Initializing...</p>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="http://localhost:5173" target="_blank" id="dashboardLink">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        Open Dashboard
      </a>
      <span class="footer-version">v1.0</span>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
