<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Clone Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Header with logo -->
    <div class="header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#6366f1" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" fill="#6366f1"/>
        <line x1="12" y1="2" x2="12" y2="6" stroke="#6366f1" stroke-width="2"/>
        <line x1="12" y1="18" x2="12" y2="22" stroke="#6366f1" stroke-width="2"/>
        <line x1="2" y1="12" x2="6" y2="12" stroke="#6366f1" stroke-width="2"/>
        <line x1="18" y1="12" x2="22" y2="12" stroke="#6366f1" stroke-width="2"/>
      </svg>
      <h2>Jam<span>.dev</span> Recorder</h2>
    </div>

    <!-- Dynamic content injected by popup.js -->
    <div class="content" id="content">
      <div class="spinner"></div>
      <p class="message">Loading...</p>
    </div>

    <!-- Footer -->
    <div class="footer">
      <a href="http://localhost:5173" target="_blank">Open Dashboard ↗</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
